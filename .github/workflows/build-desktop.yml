name: Build Desktop App

on:
  push:
    branches: [main, dev, feat-json-data-intgeration]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Build Tauri app
        run: npm run tauri build
        env:
          CI: false

      - name: Set build info
        id: info
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $date = Get-Date -Format "yyyyMMdd"
          echo "ver=$ver" >> $env:GITHUB_OUTPUT
          echo "date=$date" >> $env:GITHUB_OUTPUT
          echo "name=BCM-Opreate-TouchTable--v$ver-$date" >> $env:GITHUB_OUTPUT

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/release"
          $name = "${{ steps.info.outputs.name }}"
          $outDir = "portable/$name"
          New-Item -ItemType Directory -Force -Path $outDir

          Copy-Item "$releaseDir/app.exe" "$outDir/BCM Operate.exe"

          Compress-Archive -Path "$outDir/*" -DestinationPath "portable/$name.zip" -Force

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.info.outputs.name }}-build${{ github.run_number }}
          name: ${{ steps.info.outputs.name }}
          draft: false
          prerelease: false
          files: |
            portable/${{ steps.info.outputs.name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
